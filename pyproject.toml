[project]
name = "embedded-ins-daq"
version = "0.1.0"
description = "Developer tooling for the embedded_ins_daq ESP-IDF project."
requires-python = ">=3.12"
dependencies = [
    "black==26.3.1",
    "clang-format==22.1.1",
    "gcovr==7.2",
    "mdformat==1.0.0",
    "pre-commit==4.5.1",
    "shfmt-py==3.12.0.2",
]

[tool.black]
line-length = 88
target-version = ["py312"]
