default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --group dev black
        language: system
        files: ^tools/.*\.py$

      - id: shfmt
        name: shfmt
        entry: uv run --group dev shfmt -w -i 4 -ci -sr -bn
        language: system
        files: ^tools/.*\.sh$

      - id: mdformat
        name: mdformat
        entry: uv run --group dev mdformat
        language: system
        files: ^(?!\.agents/).+\.md$

      - id: clang-format
        name: clang-format
        entry: uv run --group dev clang-format -i
        language: system
        files: ^(main|host_tests)/.*\.(c|cc|cpp|h|hpp)$

      - id: host-coverage
        name: host-coverage
        entry: uv run --group dev python3 tools/check_host_coverage.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: cppcheck
        name: cppcheck
        entry: ./tools/run_cppcheck.sh
        language: system
        pass_filenames: false
        stages: [manual]
